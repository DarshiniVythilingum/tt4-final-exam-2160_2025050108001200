<div class="container">
  <h1>{{ title }}</h1>

  <div class="form">
    <input [(ngModel)]="newBug.title" placeholder="Title" />
    <input [(ngModel)]="newBug.description" placeholder="Description" />
    <select [(ngModel)]="newBug.priority">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>
    <button (click)="addBug()">Add Bug</button>
  </div>

  <ul class="bug-list">
    <li *ngFor="let bug of bugs">
      <strong>{{ bug.title }}</strong> - {{ bug.description }}
      <span>Priority: {{ bug.priority }}</span>
      <span>Status: {{ bug.isResolved ? "Resolved" : "Open" }}</span>
      <button (click)="toggleResolved(bug)">Toggle</button>
      <button (click)="deleteBug(bug.id)">Delete</button>
    </li>
  </ul>
</div>
